# 5090 overlay: CPU text encoder + SageAttention-3 FP8 + 4-chunk temporal window (smaller KV cache).
schema_version: 1
model:
  pipeline:
    text_encoder:
      run_on_cpu: true
      embedding_cache_size: 8
    diffusion_model:
      transformer:
        native_dit_attention_backend: sage3_fp8
        window_size_t: 4
